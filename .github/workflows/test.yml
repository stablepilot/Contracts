name: test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_PROFILE: ci

jobs:
  forge-test:
    name: forge-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1 # keep in sync with .foundry-version

      - name: Show Forge version
        run: forge --version

      # `forge fmt --check` is intentionally not enabled yet: contracts/test/StablePilotRegistry.t.sol
      # uses hand-aligned whitespace that forge fmt rewrites. Run `forge fmt` once, commit, then add:
      #   - name: Check formatting
      #     run: forge fmt --check

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vvv

  merkle-tool:
    name: merkle-tool
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/merkle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/merkle/package-lock.json
      - run: npm ci
      - name: Test vector + proofs
        run: npm test
