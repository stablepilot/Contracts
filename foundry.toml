[profile.default]
src = "contracts"
test = "contracts/test"
script = "contracts/script"
out = "contracts/out"
libs = ["lib"]
cache_path = "contracts/cache"
solc_version = "0.8.28"
auto_detect_solc = false
evm_version = "paris"
optimizer = true
optimizer_runs = 200

# Lints run on build; tests/test-helpers compare block.timestamp on purpose.
[lint]
ignore = ["contracts/test/*.sol", "contracts/test-helpers/*.sol"]

# CI profile: selected in GitHub Actions via FOUNDRY_PROFILE=ci.
# Inherits everything from [profile.default]; only overrides fuzz settings.
[profile.ci]
fuzz = { runs = 1000, seed = "0x5741424c4550494c4f54" }  # fixed seed -> reproducible CI runs
invariant = { runs = 256, depth = 50 }  # invariant campaigns also use the fuzz seed above

[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.io"
ethereum = "https://ethereum-rpc.publicnode.com"
sepolia = "https://ethereum-sepolia-rpc.publicnode.com"
base = "https://base-rpc.publicnode.com"
base_sepolia = "https://base-sepolia-rpc.publicnode.com"
arbitrum = "https://arbitrum-one-rpc.publicnode.com"
polygon = "https://polygon-bor-rpc.publicnode.com"
optimism = "https://optimism-rpc.publicnode.com"
